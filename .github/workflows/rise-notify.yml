name: rise-notify

on:
  push:
    branches: [v2024.10-a210]

permissions: {}

jobs:
  bootloaders:
    runs-on: ubuntu-24.04
    steps:
      - name: Get a riseproject-dev App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.RISEPROJECT_APP_CLIENT_ID }}
          private-key: ${{ secrets.RISEPROJECT_APP_PRIVATE_KEY }}
          owner: riseproject-dev
          repositories: android_vendor_rise
          permission-contents: write

      - name: Request a bootloader update in android_vendor_rise
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh api repos/riseproject-dev/android_vendor_rise/dispatches -f event_type=bootloader-update
